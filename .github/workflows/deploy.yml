name: Deploy to GitHub Pages

on:
  push:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
        # Menggunakan npm install bukan npm ci untuk ketahanan bila package-lock disinkronkan
      - run: npm ci

      # Secret yang belum di-set tetap diteruskan GitHub Actions sebagai STRING
      # KOSONG, bukan "tidak ada". Kalau string kosong itu masuk ke env build,
      # Nuxt meng-override runtimeConfig.public jadi "" — dan override itu
      # berjalan SETELAH nuxt.config.ts dievaluasi, sehingga default
      # `process.env.X || '<default>'` di sana tidak akan pernah menang.
      - name: Teruskan secret hanya jika tidak kosong
        env:
          SHEET_ENDPOINT: ${{ secrets.NUXT_PUBLIC_SHEET_ENDPOINT }}
          CAPTCHA_SITE_KEY: ${{ secrets.NUXT_PUBLIC_CAPTCHA_SITE_KEY }}
          REFERRAL_CHECK_ENDPOINT: ${{ secrets.NUXT_PUBLIC_REFERRAL_CHECK_ENDPOINT }}
        run: |
          if [ -n "$SHEET_ENDPOINT" ]; then
            echo "NUXT_PUBLIC_SHEET_ENDPOINT=$SHEET_ENDPOINT" >> "$GITHUB_ENV"
          fi
          if [ -n "$CAPTCHA_SITE_KEY" ]; then
            echo "NUXT_PUBLIC_CAPTCHA_SITE_KEY=$CAPTCHA_SITE_KEY" >> "$GITHUB_ENV"
          fi
          if [ -n "$REFERRAL_CHECK_ENDPOINT" ]; then
            echo "NUXT_PUBLIC_REFERRAL_CHECK_ENDPOINT=$REFERRAL_CHECK_ENDPOINT" >> "$GITHUB_ENV"
          fi

      # Deploy ke default domain GitHub Pages (https://it126sig-hash.github.io/landing-page-sip/)
      # Sub-folder /landing-page-sip/ diset via NUXT_APP_BASE_URL.
      - name: Build dan generate situs statis
        env:
          NUXT_APP_BASE_URL: /landing-page-sip/
          NUXT_PUBLIC_SITE_URL: https://it126sig-hash.github.io/landing-page-sip
        run: npm run generate

      # Pengaman: build yang endpoint-nya kosong tidak boleh sampai ter-deploy
      - name: Pastikan endpoint ter-bake di hasil build
        run: |
          if grep -rq 'sheetEndpoint:""' .output/public; then
            echo "::error::sheetEndpoint kosong di hasil build — form tidak akan bisa mengirim data."
            exit 1
          fi
          echo "OK: sheetEndpoint terisi."

      # Pastikan base path /landing-page-sip/ ter-bake di hasil build
      - name: Pastikan base path GitHub Pages terpasang
        run: |
          if ! grep -rq '/landing-page-sip/' .output/public; then
            echo "::error::Base path /landing-page-sip/ tidak ditemukan di hasil build — aset bisa 404 di GitHub Pages."
            exit 1
          fi
          echo "OK: base path /landing-page-sip/ terpasang."

      # Pastikan CNAME tidak ada agar GitHub Pages menggunakan domain github.io
      - name: Pastikan CNAME tidak ter-deploy
        run: |
          if [ -f .output/public/CNAME ]; then
            echo "Menghapus CNAME dari build artifact..."
            rm -f .output/public/CNAME
          fi
          echo "OK: domain default github.io aktif (tanpa CNAME)."

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
